name: Compile LaTeX CV

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
            - name: Build LaTeX document
              uses: dante-ev/latex-action@latest
              with:
                  root_file: cv.tex
                  compiler: xelatex
                  args: -interaction=nonstopmode -shell-escape
            - uses: actions/upload-artifact@v4
              with:
                  name: cv-pdf
                  path: cv.pdf
            - name: Commit PDF to PDF branch
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  cp cv.pdf /tmp/cv.pdf
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git fetch origin pdf
                  git checkout pdf || git checkout --orphan pdf
                  cp /tmp/cv.pdf cv.pdf
                  git add cv.pdf
                  git diff --staged --quiet || git commit -m "robot: Update compiled CV [skip ci]"
                  git push origin pdf

            - name: Sync PDF to website
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
              run: |
                  git clone --depth 1 \
                    "https://x-access-token:${TOKEN}@github.com/joshmtlau/joshmtlau.github.io.git" site
                  mkdir -p site/public
                  cp /tmp/cv.pdf site/public/cv.pdf
                  cd site
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  git add public/cv.pdf
                  git diff --staged --quiet || git commit -m "chore: sync CV PDF"
                  git push
